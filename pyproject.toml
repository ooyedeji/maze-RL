[project]
name = "biositer"
version = "0.1.0"
authors = [{ name = "Femi Oyedeji, ORNL", email = "oyedejia@ornl.gov" }]
dependencies = []
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.12.*"
pip = "26.1.*"
pygame = "2.6.*"

[tool.pixi.pypi-dependencies]
jupyter = "==1.1.*"
pytest = "==9.1.*"
torchvision = "==0.28.*"
numpy = "==2.5.*"
matplotlib = "==3.11.*"

[tool.pixi.tasks]
